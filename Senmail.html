<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two-Column Table Form</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            vertical-align: middle;
        }

        th {
            background: #f4f4f4;
        }

        .sub-col {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>Multi-Column Form</h2>

    <form id="myForm">

        <table align="center" style="width: 80%;">

            <thead>
                <tr>
                    <th>Main Column 1</th>
                    <th>Main Column 2</th>
                </tr>
            </thead>

            <tbody>
                <tr>

                    <!-- Green Chicken Curry -->
                    <td>
                        <div class="sub-col">

                            <img src="GreenChickenCurry.jpg"
                                 style="width: 100px; height: 100px;"
                                 alt="Green Chicken Curry">

                            <input type="checkbox"
                                   name="chk1"
                                   value="Green Chicken Curry">

                            <input type="text"
                                   name="txt1_a"
                                   value="Green Chicken Curry">

                            <input type="text"
                                   name="txt1_b"
                                   style="width: 70px;"
                                   value="$2">

                            Quantity&nbsp;

                            <input type="number"
                                   name="qty1"
                                   min="1"
                                   style="width: 70px;"
                                   value="1"
                                   placeholder="Quantity">

                        </div>
                    </td>

                    <!-- Chicken Salad -->
                    <td>
                        <div class="sub-col">

                            <img src="ChickenSalad.jpg"
                                 style="width: 100px; height: 100px;"
                                 alt="Chicken Salad">

                            <input type="checkbox"
                                   name="chk2"
                                   value="Chicken Salad">

                            <input type="text"
                                   name="txt2_a"
                                   value="Chicken Salad">

                            <input type="text"
                                   name="txt2_b"
                                   style="width: 70px;"
                                   value="$5">

                            Quantity&nbsp;

                            <input type="number"
                                   name="qty2"
                                   min="1"
                                   style="width: 70px;"
                                   value="1"
                                   placeholder="Quantity">

                        </div>
                    </td>

                </tr>
            </tbody>

        </table>

        <button type="button"
                onclick="saveToMessage()"
                style="font-size: 30px; color: blue;">
            Chosen menu
        </button>

        <div>
            <h3 style="background-color: blue;
                       color: yellow;
                       font-size: 30px;
                       text-align: center;">
                Chosen menu item:
            </h3>

            <textarea id="outputMessage" readonly></textarea>
        </div>

        <div>
            <label for="address"
                   style="font-size: 30px; color: blue;">
                Delivery Address:
            </label>

            <br>

            <textarea id="address"
                      name="address"
                      required></textarea>

            <br><br>
        </div>

        <div>
            <label for="orderAndaddress"
                   style="font-size: 30px; color: blue;">
                Order and Address:
            </label>

            <br>

            <textarea id="orderAndaddress"
                      name="orderAndaddress"
                      required></textarea>

            <br><br>
        </div>

    </form>

    <div class="form-container">

        <h2 style="background-color: blue;
                   color: yellow;
                   font-size: 30px;
                   text-align: center;">
            Send Order to Email
        </h2>

        <form action="https://formspree.io/f/mrpgnvyv"
              method="POST">

            <label for="order">Your order:</label>

            <textarea id="order"
                      name="order"
                      placeholder="Waiting for text..."></textarea>

            <button type="submit">
                Send order to Email
            </button>

        </form>

    </div>

    <script>
        function saveToMessage() {

            const form = document.getElementById('myForm');

            const checkboxes =
                form.querySelectorAll('input[type="checkbox"]');

            let message = "Selected Items & Values:\n";

            checkboxes.forEach((chk) => {

                if (chk.checked) {

                    const parentDiv = chk.closest('.sub-col');

                    const textInputs =
                        parentDiv.querySelectorAll(
                            'input[type="text"], input[type="number"]'
                        );

                    let textValues = Array.from(textInputs)
                        .map(input => input.value)
                        .join(', ');

                    message += `- ${chk.value}: ${textValues}\n`;
                }

            });

            document.getElementById('outputMessage').value = message;

            const text1 =
                document.getElementById('outputMessage').value;

            const text2 =
                document.getElementById('address').value;

            const combined =
                text1 + "\nDelivery Address: " + text2;

            document.getElementById('orderAndaddress').value = combined;

            document.getElementById('order').value = combined;
        }
    </script>

</body>
</html>
